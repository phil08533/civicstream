name: Ingest, build & deploy

on:
  push: { branches: [main] }
  schedule: [{ cron: "17 * * * *" }]   # hourly; Federal Register publishes once per business day
  workflow_dispatch:

permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Ingest government data
        if: github.event_name != 'push'
        env: { CONGRESS_API_KEY: "${{ secrets.CONGRESS_API_KEY }}" }
        run: npm run ingest
      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- data/documents.json data/legislation.json; then
            git config user.name "civicstream-bot" && git config user.email "bot@users.noreply.github.com"
            git add data && git commit -m "data: ingest $(date -u +%FT%TZ)" && git push
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || '/civicstream' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/civicstream', github.repository_owner) }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
